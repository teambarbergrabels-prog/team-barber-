<title>Team Barber Grabels</title>
<style>
  :root {
    --bg: #17120e;
    --surface: #221a14;
    --surface-2: #2b2119;
    --ink: #f3e9db;
    --ink-muted: #b6a488;
    --brass: #cf9a34;
    --brass-soft: #e3b654;
    --brick: #a1402f;
    --line: rgba(243, 233, 219, 0.14);
    --focus: #e3b654;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-inline: 20px;
    text-align: center;
    position: relative;
    overflow-x: hidden;
  }

  /* barber-pole accent bar */
  .pole-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 7px;
    background: repeating-linear-gradient(
      -45deg,
      var(--brick) 0 18px,
      var(--ink) 18px 36px,
      var(--brass) 36px 54px
    );
    z-index: 5;
  }

  .stage {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding-block: 48px;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brass-soft);
    font-weight: 600;
  }

  h1 {
    font-family: "Anton", "Arial Narrow", sans-serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    line-height: 1.02;
    margin: 0;
    text-wrap: balance;
    color: var(--ink);
  }

  .card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 30px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.6);
  }

  .razor {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid var(--line);
    border-top-color: var(--brass);
    border-right-color: var(--brass-soft);
    animation: spin 0.9s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .razor {
      animation: none;
      border-top-color: var(--line);
      border-right-color: var(--line);
    }
    .razor::after {
      content: "";
    }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status {
    font-size: 1.05rem;
    color: var(--ink);
    margin: 0;
  }

  .status small {
    display: block;
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--ink-muted);
    font-weight: 400;
  }

  .manual-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    padding: 13px 22px;
    border-radius: 999px;
    background: var(--brass);
    color: #1c1510;
    font-weight: 600;
    text-decoration: none;
    font-size: 0.95rem;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .manual-link:hover { background: var(--brass-soft); }
  .manual-link:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }
  .manual-link:active { transform: scale(0.98); }

  .meta {
    color: var(--ink-muted);
    font-size: 0.85rem;
    line-height: 1.6;
    border-top: 1px solid var(--line);
    padding-top: 18px;
    margin-top: 4px;
    width: 100%;
  }

  .meta strong {
    color: var(--ink);
    font-weight: 600;
  }

  noscript div {
    margin-top: 20px;
    color: var(--ink-muted);
    font-size: 0.9rem;
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div class="pole-bar" aria-hidden="true"></div>

<div class="stage">
  <div>

    <h1>Team Barber Grabels</h1>
  </div>

  <div class="card">
    <div class="razor" role="status" aria-label="Redirection en cours"></div>
    <p class="status">
      On vous emmène vers votre créneau…
      <small>Avec ou sans rendez-vous.</small>
    </p>
    <a class="manual-link" id="manual-link" href="https://www.planity.com/team-barber-grabels-34790">
      Réserver maintenant →
    </a>
    <noscript>
      <div>Le lien ci-dessus vous emmène directement à la prise de rendez-vous.</div>
    </noscript>
  </div>

  <p class="meta"><strong>Team Barber Grabels</strong> — réservation en ligne via Planity</p>
</div>
